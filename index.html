<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AgroTrace - Beneficiamento</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f3;
      color: #1f2937;
    }

    .topo {
      background: #166534;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .topo h1 {
      margin: 0;
      font-size: 25px;
    }

    .topo p {
      margin: 6px 0 0;
      font-size: 14px;
      opacity: 0.9;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .titulo {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 14px;
      color: #166534;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 12px;
      background: white;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 6px;
    }

    .btn-verde {
      background: #166534;
      color: white;
    }

    .btn-verde:active {
      background: #14532d;
    }

    .btn-cinza {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-vermelho {
      background: #b91c1c;
      color: white;
    }

    .resultado {
      display: none;
    }

    .dados {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      padding: 14px;
      margin-top: 12px;
    }

    .linha {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px solid #dcfce7;
    }

    .linha:last-child {
      border-bottom: none;
    }

    .nome {
      font-weight: bold;
    }

    .valor {
      text-align: right;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
      font-weight: bold;
      text-align: center;
    }

    .status.sucesso {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .status.erro {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .status.info {
      display: block;
      background: #dbeafe;
      color: #1e40af;
    }

    #leitor {
      width: 100%;
      margin-top: 12px;
      display: none;
    }

    .timer {
      font-size: 34px;
      text-align: center;
      font-weight: bold;
      color: #166534;
      padding: 15px;
    }

    .oculto {
      display: none;
    }

    .rodape {
      text-align: center;
      font-size: 12px;
      color: #6b7280;
      padding: 20px;
    }
  </style>
</head>

<body>

  <div class="topo">
    <h1>AgroTrace</h1>
    <p>Controle de Beneficiamento de Sementes</p>
  </div>

  <div class="container">

    <div id="status" class="status"></div>

    <!-- LOCALIZAR LOTE -->
    <div class="card" id="cardBusca">

      <div class="titulo">
        Localizar lote
      </div>

      <label>Número do lote</label>

      <input
        type="text"
        id="loteBusca"
        placeholder="Ex.: LT26-001"
        autocomplete="off"
      >

      <button
        class="btn-verde"
        onclick="buscarLote()"
      >
        🔎 Consultar lote
      </button>

      <button
        class="btn-cinza"
        onclick="abrirScanner()"
      >
        📷 Ler QR Code
      </button>

      <div id="leitor"></div>

    </div>


    <!-- DADOS DO LOTE -->
    <div class="card resultado" id="cardLote">

      <div class="titulo">
        Dados do lote
      </div>

      <div class="dados">

        <div class="linha">
          <span class="nome">Lote</span>
          <span class="valor" id="campoLote">-</span>
        </div>

        <div class="linha">
          <span class="nome">QR</span>
          <span class="valor" id="campoQR">-</span>
        </div>

        <div class="linha">
          <span class="nome">Variedade</span>
          <span class="valor" id="campoVariedade">-</span>
        </div>

        <div class="linha">
          <span class="nome">Peneira</span>
          <span class="valor" id="campoPeneira">-</span>
        </div>

        <div class="linha">
          <span class="nome">Umidade recebimento</span>
          <span class="valor" id="campoUmidadeRecebimento">-</span>
        </div>

        <div class="linha">
          <span class="nome">Peso recebido</span>
          <span class="valor" id="campoPesoRecebido">-</span>
        </div>

      </div>

    </div>


    <!-- BENEFICIAMENTO -->
    <div class="card resultado" id="cardBeneficiamento">

      <div class="titulo">
        Beneficiamento
      </div>

      <label>Operador</label>

      <input
        type="text"
        id="operador"
        placeholder="Nome do operador"
      >

      <label>Máquina</label>

      <select id="maquina">
        <option value="">Selecione</option>
        <option value="CD 500">CD 500</option>
        <option value="CD 1000">CD 1000</option>
      </select>

      <label>Umidade antes (%)</label>

      <input
        type="number"
        id="umidadeAntes"
        step="0.1"
        placeholder="Ex.: 13,5"
      >

      <label>Peso antes (kg)</label>

      <input
        type="number"
        id="pesoAntes"
        step="0.01"
        placeholder="Ex.: 1200"
      >

      <button
        class="btn-verde"
        id="btnIniciar"
        onclick="iniciarBeneficiamento()"
      >
        ▶ Iniciar Beneficiamento
      </button>

      <div id="areaTimer" class="oculto">

        <div class="timer" id="timer">
          00:00:00
        </div>

        <button
          class="btn-vermelho"
          onclick="finalizarBeneficiamento()"
        >
          ■ Finalizar Beneficiamento
        </button>

      </div>

    </div>


    <!-- FINALIZAÇÃO -->
    <div class="card resultado" id="cardFinalizacao">

      <div class="titulo">
        Finalização
      </div>

      <label>Umidade depois (%)</label>

      <input
        type="number"
        id="umidadeDepois"
        step="0.1"
        placeholder="Ex.: 12,8"
      >

      <label>Peso depois (kg)</label>

      <input
        type="number"
        id="pesoDepois"
        step="0.01"
        placeholder="Ex.: 1160"
      >

      <label>Observação</label>

      <textarea
        id="observacao"
        placeholder="Observações do processo..."
      ></textarea>

      <button
        class="btn-verde"
        onclick="salvarBeneficiamento()"
      >
        💾 Salvar Beneficiamento
      </button>

    </div>


    <!-- RESULTADO FINAL -->
    <div class="card resultado" id="cardResultado">

      <div class="titulo">
        Beneficiamento concluído
      </div>

      <div class="dados">

        <div class="linha">
          <span class="nome">Descarte</span>
          <span class="valor" id="resultadoDescarte">-</span>
        </div>

        <div class="linha">
          <span class="nome">Rendimento</span>
          <span class="valor" id="resultadoRendimento">-</span>
        </div>

        <div class="linha">
          <span class="nome">Tempo de processo</span>
          <span class="valor" id="resultadoTempo">-</span>
        </div>

      </div>

      <button
        class="btn-verde"
        onclick="novoBeneficiamento()"
      >
        + Novo Beneficiamento
      </button>

    </div>

  </div>

  <div class="rodape">
    AgroTrace • Controle de Beneficiamento
  </div>


<script>

  /*
   * URL DA API
   */
  const API_URL =
    "https://script.google.com/macros/s/AKfycbx7boqIdOtBzhFpxY2sF9Bp7MDR4_VdKTJWAOAwGwt67UHoBRrnIYshDCbXe4HzqmXv/exec";


  /*
   * VARIÁVEIS DO PROCESSO
   */

  let loteAtual = null;

  let inicioProcesso = null;

  let intervaloTimer = null;

  let scanner = null;


  /*
   * MOSTRAR STATUS
   */

  function mostrarStatus(mensagem, tipo) {

    const elemento =
      document.getElementById("status");

    elemento.innerText = mensagem;

    elemento.className =
      "status " + tipo;

  }


  /*
   * ESCONDER STATUS
   */

  function esconderStatus() {

    const elemento =
      document.getElementById("status");

    elemento.className = "status";

  }


  /*
   * CONSULTA DO LOTE
   *
   * Aqui usamos JSONP.
   */

  function consultarAPI(parametros) {

    return new Promise(function(resolve, reject) {

      const nomeCallback =
        "agroTraceCallback";

      const script =
        document.createElement("script");

      let terminou = false;


      window[nomeCallback] =
        function(resposta) {

          if (terminou) {
            return;
          }

          terminou = true;

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }

          resolve(resposta);

        };


      const url =
        API_URL +
        "?acao=buscar" +
        "&lote=" +
        encodeURIComponent(parametros.lote || "") +
        "&qr=" +
        encodeURIComponent(parametros.qr || "");


      script.src = url;

      script.async = true;


      script.onerror =
        function() {

          if (terminou) {
            return;
          }

          terminou = true;

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }

          reject(
            new Error(
              "Não foi possível acessar a API."
            )
          );

        };


      document.body.appendChild(script);


      setTimeout(function() {

        if (terminou) {
          return;
        }

        terminou = true;

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

        reject(
          new Error(
            "Tempo limite da consulta."
          )
        );

      }, 15000);

    });

  }


  /*
   * BUSCAR LOTE MANUALMENTE
   */

  async function buscarLote() {

    const lote =
      document
        .getElementById("loteBusca")
        .value
        .trim();


    if (!lote) {

      mostrarStatus(
        "Digite o número do lote.",
        "erro"
      );

      return;
    }


    mostrarStatus(
      "Consultando lote...",
      "info"
    );


    try {

      const resposta =
        await consultarAPI({
          lote: lote
        });


      console.log(
        "Resposta da API:",
        resposta
      );


      if (
        resposta.status !== "ok"
      ) {

        mostrarStatus(
          "Lote não encontrado.",
          "erro"
        );

        return;
      }


      mostrarLote(
        resposta.dados
      );


      mostrarStatus(
        "Lote localizado com sucesso.",
        "sucesso"
      );


    } catch (erro) {

      console.error(
        erro
      );

      mostrarStatus(
        "Erro ao consultar lote.",
        "erro"
      );

    }

  }


  /*
   * MOSTRAR DADOS DO LOTE
   */

  function mostrarLote(dados) {

    loteAtual =
      dados;


    document
      .getElementById("campoLote")
      .innerText =
        dados.LOTE || "-";


    document
      .getElementById("campoQR")
      .innerText =
        dados.QR || "-";


    document
      .getElementById("campoVariedade")
      .innerText =
        dados.VARIEDADE || "-";


    document
      .getElementById("campoPeneira")
      .innerText =
        dados.PENEIRA || "-";


    document
      .getElementById("campoUmidadeRecebimento")
      .innerText =
        dados.UMIDADE_RECEBIMENTO || "-";


    document
      .getElementById("campoPesoRecebido")
      .innerText =
        dados.PESO_RECEBIDO || "-";


    document
      .getElementById("cardLote")
      .style.display =
        "block";


    document
      .getElementById("cardBeneficiamento")
      .style.display =
        "block";


    document
      .getElementById("cardFinalizacao")
      .style.display =
        "none";


    document
      .getElementById("cardResultado")
      .style.display =
        "none";

  }


  /*
   * INICIAR BENEFICIAMENTO
   */

  function iniciarBeneficiamento() {

    const operador =
      document
        .getElementById("operador")
        .value
        .trim();


    const maquina =
      document
        .getElementById("maquina")
        .value;


    const umidade =
      document
        .getElementById("umidadeAntes")
        .value;


    const peso =
      document
        .getElementById("pesoAntes")
        .value;


    if (!operador) {

      mostrarStatus(
        "Informe o operador.",
        "erro"
      );

      return;
    }


    if (!maquina) {

      mostrarStatus(
        "Selecione a máquina.",
        "erro"
      );

      return;
    }


    if (!umidade || !peso) {

      mostrarStatus(
        "Informe umidade e peso antes do processo.",
        "erro"
      );

      return;
    }


    inicioProcesso =
      new Date();


    document
      .getElementById("btnIniciar")
      .style.display =
        "none";


    document
      .getElementById("areaTimer")
      .style.display =
        "block";


    intervaloTimer =
      setInterval(
        atualizarTimer,
        1000
      );


    atualizarTimer();


    mostrarStatus(
      "Beneficiamento iniciado.",
      "sucesso"
    );

  }


  /*
   * TIMER
   */

  function atualizarTimer() {

    if (!inicioProcesso) {
      return;
    }


    const agora =
      new Date();


    const segundos =
      Math.floor(
        (agora - inicioProcesso) /
        1000
      );


    const horas =
      Math.floor(
        segundos / 3600
      );


    const minutos =
      Math.floor(
        (segundos % 3600) / 60
      );


    const seg =
      segundos % 60;


    const texto =
      String(horas).padStart(2, "0") +
      ":" +
      String(minutos).padStart(2, "0") +
      ":" +
      String(seg).padStart(2, "0");


    document
      .getElementById("timer")
      .innerText =
        texto;

  }


  /*
   * FINALIZAR
   */

  function finalizarBeneficiamento() {

    if (intervaloTimer) {

      clearInterval(
        intervaloTimer
      );

    }


    document
      .getElementById("cardFinalizacao")
      .style.display =
        "block";


    mostrarStatus(
      "Informe os dados finais do beneficiamento.",
      "info"
    );

  }


  /*
   * SALVAR
   */

  async function salvarBeneficiamento() {

    const umidadeDepois =
      document
        .getElementById("umidadeDepois")
        .value;


    const pesoDepois =
      document
        .getElementById("pesoDepois")
        .value;


    const observacao =
      document
        .getElementById("observacao")
        .value;


    if (
      !umidadeDepois ||
      !pesoDepois
    ) {

      mostrarStatus(
        "Informe a umidade e o peso depois.",
        "erro"
      );

      return;
    }


    const pesoAntes =
      Number(
        document
          .getElementById("pesoAntes")
          .value
          .replace(",", ".")
      );


    const pesoFinal =
      Number(
        pesoDepois
          .replace(",", ".")
      );


    const descarte =
      pesoAntes -
      pesoFinal;


    const rendimento =
      pesoAntes > 0
        ? (pesoFinal / pesoAntes) * 100
        : 0;


    const agora =
      new Date();


    const tempoSegundos =
      Math.floor(
        (agora - inicioProcesso) /
        1000
      );


    const horas =
      Math.floor(
        tempoSegundos / 3600
      );


    const minutos =
      Math.floor(
        (tempoSegundos % 3600) / 60
      );


    const segundos =
      tempoSegundos % 60;


    const tempo =
      String(horas).padStart(2, "0") +
      ":" +
      String(minutos).padStart(2, "0") +
      ":" +
      String(segundos).padStart(2, "0");


    const dados = {

      qr:
        loteAtual.QR || "",

      lote:
        loteAtual.LOTE || "",

      variedade:
        loteAtual.VARIEDADE || "",

      peneira:
        loteAtual.PENEIRA || "",

      umidadeRecebimento:
        loteAtual.UMIDADE_RECEBIMENTO || "",

      pesoRecebimento:
        loteAtual.PESO_RECEBIDO || "",

      operador:
        document
          .getElementById("operador")
          .value,

      maquina:
        document
          .getElementById("maquina")
          .value,

      dataInicio:
        formatarData(inicioProcesso),

      horaInicio:
        formatarHora(inicioProcesso),

      umidadeAntes:
        document
          .getElementById("umidadeAntes")
          .value,

      pesoAntes:
        pesoAntes,

      dataFim:
        formatarData(agora),

      horaFim:
        formatarHora(agora),

      umidadeDepois:
        umidadeDepois,

      pesoDepois:
        pesoFinal,

      tempoProcesso:
        tempo,

      observacao:
        observacao

    };


    mostrarStatus(
      "Salvando beneficiamento...",
      "info"
    );


    /*
     * ENVIO PARA O GOOGLE APPS SCRIPT
     */

    try {

      const iframe =
        document.createElement("iframe");

      iframe.name =
        "envioAgroTrace";

      iframe.style.display =
        "none";


      document.body.appendChild(
        iframe
      );


      const formulario =
        document.createElement("form");

      formulario.method =
        "POST";

      formulario.action =
        API_URL;

      formulario.target =
        "envioAgroTrace";


      const campo =
        document.createElement("input");

      campo.type =
        "hidden";

      campo.name =
        "dados";

      campo.value =
        JSON.stringify(dados);


      formulario.appendChild(
        campo
      );


      document.body.appendChild(
        formulario
      );


      formulario.submit();


      mostrarStatus(
        "Beneficiamento enviado para o sistema.",
        "sucesso"
      );


      document
        .getElementById("resultadoDescarte")
        .innerText =
          descarte.toFixed(2) +
          " kg";


      document
        .getElementById("resultadoRendimento")
        .innerText =
          rendimento.toFixed(2) +
          "%";


      document
        .getElementById("resultadoTempo")
        .innerText =
          tempo;


      document
        .getElementById("cardResultado")
        .style.display =
          "block";


      document
        .getElementById("cardFinalizacao")
        .style.display =
          "none";


    } catch (erro) {

      console.error(
        erro
      );

      mostrarStatus(
        "Erro ao enviar os dados.",
        "erro"
      );

    }

  }


  /*
   * DATA
   */

  function formatarData(data) {

    return String(
      data.getDate()
    ).padStart(2, "0") +
      "/" +
      String(
        data.getMonth() + 1
      ).padStart(2, "0") +
      "/" +
      data.getFullYear();

  }


  /*
   * HORA
   */

  function formatarHora(data) {

    return String(
      data.getHours()
    ).padStart(2, "0") +
      ":" +
      String(
        data.getMinutes()
      ).padStart(2, "0") +
      ":" +
      String(
        data.getSeconds()
      ).padStart(2, "0");

  }


  /*
   * ABRIR LEITOR QR
   */

  function abrirScanner() {

    const elemento =
      document.getElementById("leitor");


    elemento.style.display =
      "block";


    if (scanner) {
      return;
    }


    scanner =
      new Html5Qrcode(
        "leitor"
      );


    scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,
        qrbox: 250
      },

      function(texto) {

        document
          .getElementById("loteBusca")
          .value =
            texto;


        scanner.stop()
          .then(function() {

            elemento.style.display =
              "none";

            scanner = null;

            buscarPorQR(
              texto
            );

          });

      },

      function() {}

    )
    .catch(function(erro) {

      console.error(
        erro
      );

      elemento.style.display =
        "none";

      mostrarStatus(
        "Não foi possível abrir a câmera. Verifique a permissão.",
        "erro"
      );

    });

  }


  /*
   * BUSCAR PELO QR
   */

  async function buscarPorQR(qr) {

    mostrarStatus(
      "Consultando QR Code...",
      "info"
    );


    try {

      const resposta =
        await consultarAPI({
          qr: qr
        });


      if (
        resposta.status !== "ok"
      ) {

        mostrarStatus(
          "QR Code não encontrado.",
          "erro"
        );

        return;
      }


      mostrarLote(
        resposta.dados
      );


      mostrarStatus(
        "QR Code localizado com sucesso.",
        "sucesso"
      );


    } catch (erro) {

      console.error(
        erro
      );

      mostrarStatus(
        "Erro ao consultar QR Code.",
        "erro"
      );

    }

  }


  /*
   * NOVO BENEFICIAMENTO
   */

  function novoBeneficiamento() {

    location.reload();

  }

</script>

</body>
</html>
