<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AgroTrace - Beneficiamento</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f4f3;
      color: #1f2933;
    }

    header {
      background: #173f2a;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 5px 0 0;
      font-size: 13px;
      opacity: 0.85;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
      font-size: 18px;
      color: #173f2a;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-primary {
      background: #1f6b45;
      color: white;
    }

    .btn-danger {
      background: #b42318;
      color: white;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #222;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border: 1px solid #cbd5d1;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .info-box {
      background: #f3f6f4;
      padding: 10px;
      border-radius: 8px;
    }

    .info-box small {
      display: block;
      color: #667085;
      font-size: 11px;
    }

    .info-box strong {
      display: block;
      margin-top: 4px;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      background: #eef2f0;
      margin-top: 10px;
      font-size: 14px;
    }

    .timer {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #173f2a;
      margin: 15px 0;
    }

    .hidden {
      display: none;
    }

    .resultado {
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
    }

    @media (max-width: 400px) {
      .info {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>AgroTrace</h1>
  <p>Controle de Beneficiamento de Sementes</p>
</header>

<div class="container">

  <!-- LEITOR -->
  <div class="card">

    <h2>📷 Leitura do QR Code</h2>

    <div id="reader"></div>

    <button
      id="btnCamera"
      class="btn-primary"
      onclick="iniciarCamera()">
      📷 ABRIR CÂMERA TRASEIRA
    </button>

    <button
      class="btn-secondary"
      onclick="pararCamera()">
      PARAR CÂMERA
    </button>

    <div id="status" class="status">
      Aguardando leitura do QR Code...
    </div>

  </div>


  <!-- DADOS DO LOTE -->
  <div id="dadosLote" class="card hidden">

    <h2>📦 Dados do Lote</h2>

    <div class="info">

      <div class="info-box">
        <small>QR CODE</small>
        <strong id="campoQR">-</strong>
      </div>

      <div class="info-box">
        <small>LOTE</small>
        <strong id="campoLote">-</strong>
      </div>

      <div class="info-box">
        <small>VARIEDADE</small>
        <strong id="campoVariedade">-</strong>
      </div>

      <div class="info-box">
        <small>PENEIRA</small>
        <strong id="campoPeneira">-</strong>
      </div>

      <div class="info-box">
        <small>UMIDADE RECEBIMENTO</small>
        <strong id="campoUmidadeRecebimento">-</strong>
      </div>

      <div class="info-box">
        <small>PESO RECEBIDO</small>
        <strong id="campoPesoRecebido">-</strong>
      </div>

    </div>

  </div>


  <!-- BENEFICIAMENTO -->
  <div id="operacao" class="card hidden">

    <h2>⚙️ Beneficiamento</h2>

    <label>Operador</label>
    <input
      id="operador"
      type="text"
      placeholder="Digite o nome do operador">

    <label>Máquina</label>

    <select id="maquina">

      <option value="">
        Selecione a máquina
      </option>

      <option value="CD 500">
        CD 500
      </option>

      <option value="CD 1000">
        CD 1000
      </option>

    </select>


    <label>Umidade antes do beneficiamento (%)</label>

    <input
      id="umidadePre"
      type="number"
      step="0.1"
      placeholder="Ex.: 13.5">


    <label>Peso inicial (kg)</label>

    <input
      id="pesoInicial"
      type="number"
      step="0.01"
      placeholder="Ex.: 1200">


    <label>Observação</label>

    <textarea
      id="observacao"
      placeholder="Observações do processo..."></textarea>


    <button
      id="btnIniciar"
      class="btn-primary"
      onclick="iniciarBeneficiamento()">

      ▶ INICIAR BENEFICIAMENTO

    </button>


    <div
      id="timer"
      class="timer hidden">

      00:00:00

    </div>


    <button
      id="btnFinalizar"
      class="btn-danger hidden"
      onclick="abrirFinalizacao()">

      ■ FINALIZAR BENEFICIAMENTO

    </button>

  </div>


  <!-- FINALIZAÇÃO -->
  <div id="finalizacao" class="card hidden">

    <h2>✅ Finalização</h2>

    <label>Peso final (kg)</label>

    <input
      id="pesoFinal"
      type="number"
      step="0.01"
      placeholder="Digite o peso final">


    <div class="info">

      <div class="info-box">

        <small>DESCARTE</small>

        <strong id="resultadoDescarte">
          0 kg
        </strong>

      </div>

      <div class="info-box">

        <small>RENDIMENTO</small>

        <strong id="resultadoRendimento">
          0 %
        </strong>

      </div>

    </div>


    <button
      class="btn-primary"
      onclick="finalizarBeneficiamento()">

      💾 SALVAR BENEFICIAMENTO

    </button>

  </div>

</div>


<script>

const API_URL =
'https://script.google.com/macros/s/AKfycbzy3I6pS51O2t_4SaknhBAbFX81lokKEOJp6y22ea8oBrw1_Crcv1SdV9pRkcIkRUXpkA/exec';


let qrScanner = null;

let loteAtual = null;

let inicioBeneficiamento = null;

let timerInterval = null;


/*
====================================================
STATUS
====================================================
*/

function mostrarStatus(mensagem) {

  document.getElementById("status").innerText =
    mensagem;

}


/*
====================================================
CÂMERA
====================================================
*/

async function iniciarCamera() {

  mostrarStatus(
    "Solicitando acesso à câmera..."
  );

  try {

    if (qrScanner) {

      try {
        await qrScanner.stop();
      } catch(e) {}

    }


    qrScanner =
      new Html5Qrcode("reader");


    /*
    PRIMEIRA TENTATIVA:
    câmera traseira
    */

    try {

      await qrScanner.start(

        {
          facingMode: {
            exact: "environment"
          }
        },

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }

        },

        codigoLido,

        erroLeitura

      );


      mostrarStatus(
        "📷 Câmera traseira ativada. Aponte para o QR Code."
      );

      return;

    } catch (erroTraseira) {

      console.log(
        "Tentativa traseira falhou:",
        erroTraseira
      );

    }


    /*
    SEGUNDA TENTATIVA:
    ambiente/traseira sem exact
    */

    try {

      await qrScanner.start(

        {
          facingMode: "environment"
        },

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }

        },

        codigoLido,

        erroLeitura

      );


      mostrarStatus(
        "📷 Câmera traseira ativada."
      );

      return;

    } catch (erroAmbiente) {

      console.log(
        "Segunda tentativa falhou:",
        erroAmbiente
      );

    }


    /*
    ÚLTIMA TENTATIVA:
    lista as câmeras disponíveis
    */

    const cameras =
      await Html5Qrcode.getCameras();


    if (!cameras || cameras.length === 0) {

      throw new Error(
        "Nenhuma câmera encontrada."
      );

    }


    /*
    Procuramos pelo nome da câmera
    */

    let cameraTraseira =
      cameras.find(camera => {

        const nome =
          (camera.label || "")
            .toLowerCase();

        return (
          nome.includes("back") ||
          nome.includes("rear") ||
          nome.includes("environment") ||
          nome.includes("traseira") ||
          nome.includes("trás")
        );

      });


    /*
    Se não encontrou pelo nome,
    usamos a última câmera.
    Em muitos celulares ela é a traseira.
    */

    const cameraEscolhida =
      cameraTraseira || cameras[cameras.length - 1];


    await qrScanner.start(

      cameraEscolhida.id,

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }

      },

      codigoLido,

      erroLeitura

    );


    mostrarStatus(
      "📷 Câmera traseira selecionada."
    );


  } catch (erro) {

    console.error(erro);

    mostrarStatus(
      "❌ Não foi possível abrir a câmera. Verifique a permissão do navegador."
    );

  }

}


/*
====================================================
PARAR CÂMERA
====================================================
*/

async function pararCamera() {

  if (!qrScanner) {
    return;
  }

  try {

    await qrScanner.stop();

    mostrarStatus(
      "Câmera parada."
    );

  } catch (erro) {

    console.log(erro);

  }

}


/*
====================================================
QR LIDO
====================================================
*/

function codigoLido(qr) {

  mostrarStatus(
    "🔎 QR encontrado: " + qr +
    ". Consultando lote..."
  );


  pararCamera();


  buscarLote(qr);

}


/*
====================================================
ERRO DE LEITURA
====================================================
*/

function erroLeitura(errorMessage) {

  /*
  Não fazemos nada.
  O leitor fica tentando encontrar o QR.
  */

}


/*
====================================================
BUSCAR LOTE
====================================================
*/

function buscarLote(qr) {

  const callbackName =
    "callbackQR_" +
    Date.now();


  window[callbackName] =
    function(resposta) {

      try {

        if (!resposta.sucesso) {

          mostrarStatus(
            "❌ " +
            resposta.mensagem
          );

          return;

        }


        loteAtual =
          resposta.dados;


        preencherLote(
          resposta.dados
        );


        mostrarStatus(
          "✅ Lote encontrado."
        );


      } finally {

        delete window[callbackName];

      }

    };


  const script =
    document.createElement("script");


  script.src =
    API_URL +
    "?acao=buscar" +
    "&qr=" +
    encodeURIComponent(qr) +
    "&callback=" +
    callbackName;


  script.onerror =
    function() {

      mostrarStatus(
        "❌ Erro ao consultar o sistema."
      );

      delete window[callbackName];

    };


  document.body.appendChild(script);

}


/*
====================================================
PREENCHER LOTE
====================================================
*/

function preencherLote(dados) {

  document.getElementById(
    "campoQR"
  ).innerText =
    dados.QR || "-";


  document.getElementById(
    "campoLote"
  ).innerText =
    dados.LOTE || "-";


  document.getElementById(
    "campoVariedade"
  ).innerText =
    dados.VARIEDADE || "-";


  document.getElementById(
    "campoPeneira"
  ).innerText =
    dados.PENEIRA || "-";


  document.getElementById(
    "campoUmidadeRecebimento"
  ).innerText =
    dados.UMIDADE_RECEBIMENTO || "-";


  document.getElementById(
    "campoPesoRecebido"
  ).innerText =
    dados.PESO_RECEBIDO || "-";


  document.getElementById(
    "dadosLote"
  ).classList.remove("hidden");


  document.getElementById(
    "operacao"
  ).classList.remove("hidden");

}


/*
====================================================
INICIAR BENEFICIAMENTO
====================================================
*/

function iniciarBeneficiamento() {

  const operador =
    document.getElementById(
      "operador"
    ).value.trim();


  const maquina =
    document.getElementById(
      "maquina"
    ).value;


  const umidade =
    document.getElementById(
      "umidadePre"
    ).value;


  const peso =
    document.getElementById(
      "pesoInicial"
    ).value;


  if (!operador) {

    alert(
      "Informe o operador."
    );

    return;

  }


  if (!maquina) {

    alert(
      "Selecione a máquina."
    );

    return;

  }


  if (!umidade) {

    alert(
      "Informe a umidade."
    );

    return;

  }


  if (!peso) {

    alert(
      "Informe o peso inicial."
    );

    return;

  }


  inicioBeneficiamento =
    new Date();


  document.getElementById(
    "btnIniciar"
  ).classList.add("hidden");


  document.getElementById(
    "btnFinalizar"
  ).classList.remove("hidden");


  document.getElementById(
    "timer"
  ).classList.remove("hidden");


  iniciarTimer();

}


/*
====================================================
TIMER
====================================================
*/

function iniciarTimer() {

  clearInterval(
    timerInterval
  );


  timerInterval =
    setInterval(

      function() {

        const agora =
          new Date();


        const diferenca =
          agora -
          inicioBeneficiamento;


        const segundos =
          Math.floor(
            diferenca / 1000
          );


        const horas =
          Math.floor(
            segundos / 3600
          );


        const minutos =
          Math.floor(
            (segundos % 3600) / 60
          );


        const seg =
          segundos % 60;


        document.getElementById(
          "timer"
        ).innerText =

          String(horas).padStart(2,"0") +
          ":" +
          String(minutos).padStart(2,"0") +
          ":" +
          String(seg).padStart(2,"0");

      },

      1000

    );

}


/*
====================================================
ABRIR FINALIZAÇÃO
====================================================
*/

function abrirFinalizacao() {

  clearInterval(
    timerInterval
  );


  document.getElementById(
    "finalizacao"
  ).classList.remove("hidden");


  document.getElementById(
    "pesoFinal"
  ).focus();

}


/*
====================================================
CALCULAR RESULTADOS
====================================================
*/

document.getElementById(
  "pesoFinal"
).addEventListener(

  "input",

  function() {

    const inicial =
      Number(
        document.getElementById(
          "pesoInicial"
        ).value
      );


    const final =
      Number(
        this.value
      );


    if (
      inicial > 0 &&
      final >= 0
    ) {

      const descarte =
        inicial - final;


      const rendimento =
        (final / inicial) *
        100;


      document.getElementById(
        "resultadoDescarte"
      ).innerText =
        descarte.toFixed(2) +
        " kg";


      document.getElementById(
        "resultadoRendimento"
      ).innerText =
        rendimento.toFixed(2) +
        "%";

    }

  }

);


/*
====================================================
FINALIZAR E SALVAR
====================================================
*/

function finalizarBeneficiamento() {

  const pesoInicial =
    Number(
      document.getElementById(
        "pesoInicial"
      ).value
    );


  const pesoFinal =
    Number(
      document.getElementById(
        "pesoFinal"
      ).value
    );


  if (
    !pesoFinal &&
    pesoFinal !== 0
  ) {

    alert(
      "Informe o peso final."
    );

    return;

  }


  const agora =
    new Date();


  const dataInicio =
    inicioBeneficiamento
      .toLocaleDateString("pt-BR");


  const horaInicio =
    inicioBeneficiamento
      .toLocaleTimeString("pt-BR");


  const dataFim =
    agora
      .toLocaleDateString("pt-BR");


  const horaFim =
    agora
      .toLocaleTimeString("pt-BR");


  const descarte =
    pesoInicial -
    pesoFinal;


  const rendimento =
    pesoInicial > 0
      ? (pesoFinal / pesoInicial) * 100
      : 0;


  const dados = {

    QR:
      loteAtual.QR || "",

    LOTE:
      loteAtual.LOTE || "",

    VARIEDADE:
      loteAtual.VARIEDADE || "",

    PENEIRA:
      loteAtual.PENEIRA || "",

    OPERADOR:
      document.getElementById(
        "operador"
      ).value,

    MAQUINA:
      document.getElementById(
        "maquina"
      ).value,

    DATA_INICIO:
      dataInicio,

    HORA_INICIO:
      horaInicio,

    UMIDADE_PRE:
      document.getElementById(
        "umidadePre"
      ).value,

    PESO_INICIAL:
      pesoInicial,

    DATA_FIM:
      dataFim,

    HORA_FIM:
      horaFim,

    PESO_FINAL:
      pesoFinal,

    OBSERVACAO:
      document.getElementById(
        "observacao"
      ).value,

    STATUS:
      "FINALIZADO"

  };


  salvarDados(dados);

}


/*
====================================================
SALVAR NO APPS SCRIPT
====================================================
*/

function salvarDados(dados) {

  mostrarStatus(
    "💾 Salvando beneficiamento..."
  );


  const formulario =
    document.createElement("form");


  formulario.method =
    "POST";


  formulario.action =
    API_URL;


  formulario.target =
    "iframeEnvio";


  const campo =
    document.createElement("input");


  campo.type =
    "hidden";


  campo.name =
    "dados";


  campo.value =
    JSON.stringify(dados);


  formulario.appendChild(
    campo
  );


  document.body.appendChild(
    formulario
  );


  formulario.submit();


  setTimeout(

    function() {

      mostrarStatus(
        "✅ Beneficiamento enviado para o sistema."
      );


      alert(
        "Beneficiamento salvo com sucesso!"
      );


      location.reload();

    },

    1500

  );

}

</script>


<iframe
  name="iframeEnvio"
  style="display:none;">
</iframe>

</body>
</html>
