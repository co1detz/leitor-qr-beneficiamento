<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AgroTrace - Beneficiamento</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f5f3;
      color: #222;
    }


    header {
      background: #176b3a;
      color: white;
      padding: 18px;
      text-align: center;
    }


    header h1 {
      margin: 0;
      font-size: 24px;
    }


    header p {
      margin: 5px 0 0;
      font-size: 13px;
      opacity: 0.9;
    }


    .container {
      max-width: 600px;
      margin: auto;
      padding: 15px;
    }


    .card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }


    .card h2 {
      margin-top: 0;
      font-size: 18px;
      color: #176b3a;
    }


    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: bold;
    }


    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }


    textarea {
      min-height: 80px;
      resize: vertical;
    }


    button {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 13px;
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }


    .btn-primary {
      background: #176b3a;
      color: white;
    }


    .btn-secondary {
      background: #e8eee9;
      color: #176b3a;
    }


    .btn-danger {
      background: #b3261e;
      color: white;
    }


    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }


    .status {
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      display: none;
      font-size: 14px;
    }


    .status.success {
      display: block;
      background: #e4f4e9;
      color: #176b3a;
    }


    .status.error {
      display: block;
      background: #fde8e7;
      color: #a11d17;
    }


    .status.info {
      display: block;
      background: #e8f0f8;
      color: #24577a;
    }


    .dados-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }


    .dado {
      background: #f5f7f5;
      padding: 10px;
      border-radius: 8px;
    }


    .dado strong {
      display: block;
      font-size: 11px;
      color: #777;
      margin-bottom: 4px;
    }


    .dado span {
      font-size: 15px;
      font-weight: bold;
    }


    .timer {
      text-align: center;
      font-size: 38px;
      font-weight: bold;
      color: #176b3a;
      padding: 15px;
    }


    .resultado {
      text-align: center;
      background: #eef7f0;
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
    }


    .resultado .valor {
      font-size: 28px;
      font-weight: bold;
      color: #176b3a;
    }


    #dadosLote,
    #etapaBeneficiamento,
    #etapaFinalizacao {
      display: none;
    }

  </style>

</head>


<body>


<header>

  <h1>AgroTrace</h1>

  <p>
    Controle de Beneficiamento de Sementes
  </p>

</header>



<div class="container">


  <!-- =========================================
       IDENTIFICAÇÃO DO LOTE
       ========================================= -->

  <div class="card">

    <h2>
      1. Identificação do lote
    </h2>


    <label for="lote">
      Número do lote
    </label>


    <input
      type="text"
      id="lote"
      placeholder="Ex.: LT26-001"
      autocomplete="off"
    >


    <button
      class="btn-primary"
      onclick="consultarLote()"
    >
      Consultar lote
    </button>


    <button
      class="btn-secondary"
      onclick="limparTela()"
    >
      Limpar
    </button>


    <div
      id="status"
      class="status"
    ></div>

  </div>



  <!-- =========================================
       DADOS DO LOTE
       ========================================= -->

  <div
    class="card"
    id="dadosLote"
  >

    <h2>
      Dados do lote
    </h2>


    <div class="dados-grid">


      <div class="dado">

        <strong>
          QR
        </strong>

        <span id="campoQR">
          -
        </span>

      </div>


      <div class="dado">

        <strong>
          LOTE
        </strong>

        <span id="campoLote">
          -
        </span>

      </div>


      <div class="dado">

        <strong>
          VARIEDADE
        </strong>

        <span id="campoVariedade">
          -
        </span>

      </div>


      <div class="dado">

        <strong>
          PENEIRA
        </strong>

        <span id="campoPeneira">
          -
        </span>

      </div>


      <div class="dado">

        <strong>
          UMIDADE RECEBIMENTO
        </strong>

        <span id="campoUmidadeRecebimento">
          -
        </span>

      </div>


      <div class="dado">

        <strong>
          PESO RECEBIDO
        </strong>

        <span id="campoPesoRecebido">
          -
        </span>

      </div>


    </div>

  </div>



  <!-- =========================================
       INÍCIO DO BENEFICIAMENTO
       ========================================= -->

  <div
    class="card"
    id="etapaBeneficiamento"
  >

    <h2>
      2. Iniciar beneficiamento
    </h2>


    <label for="operador">
      Operador
    </label>


    <input
      type="text"
      id="operador"
      placeholder="Nome do operador"
    >


    <label for="maquina">
      Máquina
    </label>


    <select id="maquina">

      <option value="">
        Selecione a máquina
      </option>

      <option value="CD 500">
        CD 500
      </option>

      <option value="CD 1000">
        CD 1000
      </option>

    </select>


    <label for="umidadeAntes">
      Umidade antes do beneficiamento (%)
    </label>


    <input
      type="number"
      id="umidadeAntes"
      step="0.1"
      placeholder="Ex.: 13,5"
    >


    <label for="pesoAntes">
      Peso antes do beneficiamento (kg)
    </label>


    <input
      type="number"
      id="pesoAntes"
      step="0.1"
      placeholder="Ex.: 1200"
    >


    <button
      class="btn-primary"
      id="btnIniciar"
      onclick="iniciarBeneficiamento()"
    >
      Iniciar Beneficiamento
    </button>


    <div
      id="timer"
      class="timer"
    >
      00:00:00
    </div>

  </div>



  <!-- =========================================
       FINALIZAÇÃO
       ========================================= -->

  <div
    class="card"
    id="etapaFinalizacao"
  >

    <h2>
      3. Finalizar beneficiamento
    </h2>


    <label for="umidadeDepois">
      Umidade depois do beneficiamento (%)
    </label>


    <input
      type="number"
      id="umidadeDepois"
      step="0.1"
      placeholder="Ex.: 12,8"
    >


    <label for="pesoDepois">
      Peso depois do beneficiamento (kg)
    </label>


    <input
      type="number"
      id="pesoDepois"
      step="0.1"
      placeholder="Ex.: 1160"
    >


    <label for="observacao">
      Observação
    </label>


    <textarea
      id="observacao"
      placeholder="Digite alguma observação sobre o processo..."
    ></textarea>


    <button
      class="btn-danger"
      onclick="finalizarBeneficiamento()"
    >
      Finalizar Beneficiamento
    </button>

  </div>



  <!-- =========================================
       RESULTADO
       ========================================= -->

  <div
    class="card"
    id="resultadoCard"
    style="display:none;"
  >

    <h2>
      Resultado
    </h2>


    <div class="resultado">

      <div>
        Descarte
      </div>

      <div
        class="valor"
        id="resultadoDescarte"
      >
        0 kg
      </div>

    </div>


    <div class="resultado">

      <div>
        Rendimento
      </div>

      <div
        class="valor"
        id="resultadoRendimento"
      >
        0%
      </div>

    </div>


    <div class="resultado">

      <div>
        Tempo de processo
      </div>

      <div
        class="valor"
        id="resultadoTempo"
      >
        00:00:00
      </div>

    </div>


    <button
      class="btn-primary"
      onclick="novoBeneficiamento()"
    >
      Novo Beneficiamento
    </button>

  </div>


</div>



<script>


/* =================================================
   CONFIGURAÇÃO DA API
   ================================================= */


const API_URL =
"https://script.google.com/macros/s/AKfycbx7boqIdOtBzhFpxY2sF9Bp7MDR4_VdKTJWAOAwGwt67UHoBRrnIYshDCbXe4HzqmXv/exec";



/* =================================================
   VARIÁVEIS
   ================================================= */


let loteAtual = null;

let inicioProcesso = null;

let intervaloTimer = null;



/* =================================================
   CONSULTAR LOTE
   ================================================= */


function consultarLote() {


  const lote =
    document
      .getElementById("lote")
      .value
      .trim();


  if (!lote) {

    mostrarStatus(
      "Digite o número do lote.",
      "error"
    );

    return;
  }


  mostrarStatus(
    "Consultando lote...",
    "info"
  );


  consultar(lote)

    .then(function(resposta) {


      console.log(
        "Resposta recebida:",
        resposta
      );


      if (
        resposta &&
        resposta.status === "ok"
      ) {


        loteAtual =
          resposta.dados;


        preencherDadosLote(
          resposta.dados
        );


        document
          .getElementById(
            "dadosLote"
          )
          .style.display =
          "block";


        document
          .getElementById(
            "etapaBeneficiamento"
          )
          .style.display =
          "block";


        mostrarStatus(
          "Lote encontrado com sucesso.",
          "success"
        );


      }

      else {


        document
          .getElementById(
            "dadosLote"
          )
          .style.display =
          "none";


        document
          .getElementById(
            "etapaBeneficiamento"
          )
          .style.display =
          "none";


        mostrarStatus(
          resposta &&
          resposta.mensagem
            ? resposta.mensagem
            : "Lote não encontrado.",
          "error"
        );

      }

    })


    .catch(function(erro) {


      console.error(
        "Erro na consulta:",
        erro
      );


      mostrarStatus(
        "Erro ao consultar lote. Verifique a conexão com a API.",
        "error"
      );

    });

}



/* =================================================
   COMUNICAÇÃO COM GOOGLE APPS SCRIPT
   ================================================= */


function consultar(lote) {


  return new Promise(function(
    resolve,
    reject
  ) {


    const iframe =
      document.createElement(
        "iframe"
      );


    iframe.style.display =
      "none";


    let timeout;



    /*
    -----------------------------------------------
    RECEBER RESPOSTA
    -----------------------------------------------
    */


    function receberResposta(
      evento
    ) {


      console.log(
        "Mensagem recebida do Apps Script:",
        evento.data
      );


      if (
        !evento.data ||
        evento.data.tipo !==
        "AGROTRACE"
      ) {

        return;

      }


      clearTimeout(
        timeout
      );


      window.removeEventListener(
        "message",
        receberResposta
      );


      if (
        iframe.parentNode
      ) {

        iframe.parentNode
          .removeChild(
            iframe
          );

      }


      resolve(
        evento.data.dados
      );

    }



    /*
    -----------------------------------------------
    PRIMEIRO COMEÇA A ESCUTAR
    -----------------------------------------------
    */


    window.addEventListener(
      "message",
      receberResposta
    );



    /*
    -----------------------------------------------
    TEMPO LIMITE
    -----------------------------------------------
    */


    timeout =
      setTimeout(function() {


        window.removeEventListener(
          "message",
          receberResposta
        );


        if (
          iframe.parentNode
        ) {

          iframe.parentNode
            .removeChild(
              iframe
            );

        }


        reject(
          new Error(
            "Tempo limite da consulta."
          )
        );


      }, 15000);



    /*
    -----------------------------------------------
    DEPOIS ABRE O APPS SCRIPT
    -----------------------------------------------
    */


    iframe.src =
      API_URL +
      "?acao=buscar" +
      "&lote=" +
      encodeURIComponent(
        lote
      );


    document.body.appendChild(
      iframe
    );


  });

}



/* =================================================
   PREENCHER DADOS DO LOTE
   ================================================= */


function preencherDadosLote(
  dados
) {


  document
    .getElementById(
      "campoQR"
    )
    .textContent =
      dados.QR || "-";


  document
    .getElementById(
      "campoLote"
    )
    .textContent =
      dados.LOTE || "-";


  document
    .getElementById(
      "campoVariedade"
    )
    .textContent =
      dados.VARIEDADE || "-";


  document
    .getElementById(
      "campoPeneira"
    )
    .textContent =
      dados.PENEIRA || "-";


  document
    .getElementById(
      "campoUmidadeRecebimento"
    )
    .textContent =
      dados.UMIDADE_RECEBIMENTO || "-";


  document
    .getElementById(
      "campoPesoRecebido"
    )
    .textContent =
      dados.PESO_RECEBIDO || "-";

}



/* =================================================
   STATUS
   ================================================= */


function mostrarStatus(
  mensagem,
  tipo
) {


  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    mensagem;


  status.className =
    "status " + tipo;

}



/* =================================================
   INICIAR BENEFICIAMENTO
   ================================================= */


function iniciarBeneficiamento() {


  const operador =
    document
      .getElementById(
        "operador"
      )
      .value
      .trim();


  const maquina =
    document
      .getElementById(
        "maquina"
      )
      .value;


  const umidadeAntes =
    document
      .getElementById(
        "umidadeAntes"
      )
      .value;


  const pesoAntes =
    document
      .getElementById(
        "pesoAntes"
      )
      .value;


  if (!operador) {

    alert(
      "Informe o operador."
    );

    return;
  }


  if (!maquina) {

    alert(
      "Selecione a máquina."
    );

    return;
  }


  if (!umidadeAntes) {

    alert(
      "Informe a umidade antes do beneficiamento."
    );

    return;
  }


  if (!pesoAntes) {

    alert(
      "Informe o peso antes do beneficiamento."
    );

    return;
  }


  inicioProcesso =
    new Date();


  document
    .getElementById(
      "btnIniciar"
    )
    .disabled =
    true;


  document
    .getElementById(
      "etapaFinalizacao"
    )
    .style.display =
    "block";


  iniciarTimer();


  mostrarStatus(
    "Beneficiamento iniciado.",
    "success"
  );

}



/* =================================================
   TIMER
   ================================================= */


function iniciarTimer() {


  clearInterval(
    intervaloTimer
  );


  intervaloTimer =
    setInterval(function() {


      if (!inicioProcesso) {
        return;
      }


      const agora =
        new Date();


      const diferenca =
        agora -
        inicioProcesso;


      document
        .getElementById(
          "timer"
        )
        .textContent =
        formatarTempo(
          diferenca
        );


    }, 1000);

}



/* =================================================
   FORMATAR TEMPO
   ================================================= */


function formatarTempo(
  milissegundos
) {


  const totalSegundos =
    Math.floor(
      milissegundos /
      1000
    );


  const horas =
    Math.floor(
      totalSegundos /
      3600
    );


  const minutos =
    Math.floor(
      (
        totalSegundos %
        3600
      ) / 60
    );


  const segundos =
    totalSegundos %
    60;


  return (

    String(horas)
      .padStart(2, "0")

    + ":" +

    String(minutos)
      .padStart(2, "0")

    + ":" +

    String(segundos)
      .padStart(2, "0")

  );

}



/* =================================================
   FINALIZAR BENEFICIAMENTO
   ================================================= */


function finalizarBeneficiamento() {


  const pesoAntes =
    parseFloat(
      document
        .getElementById(
          "pesoAntes"
        )
        .value
        .replace(",", ".")
    );


  const pesoDepois =
    parseFloat(
      document
        .getElementById(
          "pesoDepois"
        )
        .value
        .replace(",", ".")
    );


  const umidadeDepois =
    document
      .getElementById(
        "umidadeDepois"
      )
      .value;


  if (!umidadeDepois) {

    alert(
      "Informe a umidade depois do beneficiamento."
    );

    return;
  }


  if (
    isNaN(pesoDepois) ||
    pesoDepois <= 0
  ) {

    alert(
      "Informe um peso depois do beneficiamento válido."
    );

    return;
  }


  if (
    isNaN(pesoAntes) ||
    pesoAntes <= 0
  ) {

    alert(
      "Peso antes do beneficiamento inválido."
    );

    return;
  }


  const pesoDescarte =
    pesoAntes -
    pesoDepois;


  const rendimento =
    (
      pesoDepois /
      pesoAntes
    ) *
    100;


  const tempo =
    inicioProcesso
      ? new Date() -
        inicioProcesso
      : 0;


  clearInterval(
    intervaloTimer
  );


  document
    .getElementById(
      "resultadoDescarte"
    )
    .textContent =
    pesoDescarte
      .toFixed(2)
      .replace(".", ",")
    + " kg";


  document
    .getElementById(
      "resultadoRendimento"
    )
    .textContent =
    rendimento
      .toFixed(2)
      .replace(".", ",")
    + "%";


  document
    .getElementById(
      "resultadoTempo"
    )
    .textContent =
    formatarTempo(
      tempo
    );


  document
    .getElementById(
      "resultadoCard"
    )
    .style.display =
    "block";


  mostrarStatus(
    "Beneficiamento finalizado. Resultado calculado.",
    "success"
  );

}



/* =================================================
   LIMPAR TELA
   ================================================= */


function limparTela() {


  clearInterval(
    intervaloTimer
  );


  loteAtual =
    null;


  inicioProcesso =
    null;


  document
    .getElementById(
      "lote"
    )
    .value =
    "";


  document
    .getElementById(
      "operador"
    )
    .value =
    "";


  document
    .getElementById(
      "maquina"
    )
    .value =
    "";


  document
    .getElementById(
      "umidadeAntes"
    )
    .value =
    "";


  document
    .getElementById(
      "pesoAntes"
    )
    .value =
    "";


  document
    .getElementById(
      "umidadeDepois"
    )
    .value =
    "";


  document
    .getElementById(
      "pesoDepois"
    )
    .value =
    "";


  document
    .getElementById(
      "observacao"
    )
    .value =
    "";


  document
    .getElementById(
      "dadosLote"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "etapaBeneficiamento"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "etapaFinalizacao"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "resultadoCard"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "btnIniciar"
    )
    .disabled =
    false;


  document
    .getElementById(
      "timer"
    )
    .textContent =
    "00:00:00";


  document
    .getElementById(
      "status"
    )
    .className =
    "status";


  document
    .getElementById(
      "status"
    )
    .textContent =
    "";

}



/* =================================================
   NOVO BENEFICIAMENTO
   ================================================= */


function novoBeneficiamento() {


  limparTela();


  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

}


</script>


</body>

</html>
