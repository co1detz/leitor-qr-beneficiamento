<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AgroTrace - Beneficiamento</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f4;
      color: #1f2937;
    }

    .header {
      background: #166534;
      color: white;
      padding: 22px 18px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 26px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 18px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .titulo {
      font-size: 19px;
      font-weight: bold;
      color: #166534;
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 13px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 7px;
      cursor: pointer;
    }

    .verde {
      background: #166534;
      color: white;
    }

    .cinza {
      background: #e5e7eb;
      color: #111827;
    }

    .vermelho {
      background: #b91c1c;
      color: white;
    }

    .status {
      display: none;
      padding: 12px;
      border-radius: 9px;
      margin-bottom: 15px;
      text-align: center;
      font-weight: bold;
    }

    .status.info {
      display: block;
      background: #dbeafe;
      color: #1e40af;
    }

    .status.ok {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .status.erro {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .dados {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      padding: 12px;
    }

    .linha {
      display: flex;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid #dcfce7;
      gap: 10px;
    }

    .linha:last-child {
      border-bottom: 0;
    }

    .campo {
      font-weight: bold;
    }

    .valor {
      text-align: right;
    }

    .timer {
      text-align: center;
      font-size: 38px;
      font-weight: bold;
      color: #166534;
      padding: 15px 0;
    }

    #scanner {
      display: none;
      margin-top: 15px;
    }

    .oculto {
      display: none;
    }

    .rodape {
      text-align: center;
      color: #6b7280;
      font-size: 12px;
      padding: 20px;
    }

  </style>

</head>


<body>

  <div class="header">

    <h1>AgroTrace</h1>

    <p>
      Controle de Beneficiamento de Sementes
    </p>

  </div>


  <div class="container">


    <div id="status" class="status"></div>


    <!-- BUSCA -->

    <div class="card">

      <div class="titulo">
        Localizar lote
      </div>

      <label>
        Número do lote
      </label>

      <input
        id="lote"
        type="text"
        placeholder="Ex.: LT26-001"
      >

      <button
        class="verde"
        onclick="buscarLote()"
      >
        🔎 Consultar lote
      </button>

      <button
        class="cinza"
        onclick="abrirScanner()"
      >
        📷 Ler QR Code
      </button>

      <div id="scanner"></div>

    </div>


    <!-- DADOS -->

    <div
      id="dadosLote"
      class="card oculto"
    >

      <div class="titulo">
        Dados do lote
      </div>

      <div class="dados">

        <div class="linha">
          <span class="campo">Lote</span>
          <span
            class="valor"
            id="dLote">
          </span>
        </div>

        <div class="linha">
          <span class="campo">QR</span>
          <span
            class="valor"
            id="dQR">
          </span>
        </div>

        <div class="linha">
          <span class="campo">Variedade</span>
          <span
            class="valor"
            id="dVariedade">
          </span>
        </div>

        <div class="linha">
          <span class="campo">Peneira</span>
          <span
            class="valor"
            id="dPeneira">
          </span>
        </div>

        <div class="linha">
          <span class="campo">
            Umidade recebimento
          </span>

          <span
            class="valor"
            id="dUmidade">
          </span>
        </div>

        <div class="linha">

          <span class="campo">
            Peso recebido
          </span>

          <span
            class="valor"
            id="dPeso">
          </span>

        </div>

      </div>

    </div>


    <!-- BENEFICIAMENTO -->

    <div
      id="beneficiamento"
      class="card oculto"
    >

      <div class="titulo">
        Beneficiamento
      </div>


      <label>
        Operador
      </label>

      <input
        id="operador"
        type="text"
        placeholder="Nome do operador"
      >


      <label>
        Máquina
      </label>

      <select id="maquina">

        <option value="">
          Selecione
        </option>

        <option value="CD 500">
          CD 500
        </option>

        <option value="CD 1000">
          CD 1000
        </option>

      </select>


      <label>
        Umidade antes (%)
      </label>

      <input
        id="umidadeAntes"
        type="number"
        step="0.1"
        placeholder="Ex.: 13,5"
      >


      <label>
        Peso antes (kg)
      </label>

      <input
        id="pesoAntes"
        type="number"
        step="0.01"
        placeholder="Ex.: 1200"
      >


      <button
        id="btnIniciar"
        class="verde"
        onclick="iniciar()"
      >
        ▶ Iniciar Beneficiamento
      </button>


      <div
        id="areaProcesso"
        class="oculto"
      >

        <div
          id="timer"
          class="timer">
          00:00:00
        </div>

        <button
          class="vermelho"
          onclick="finalizar()"
        >
          ■ Finalizar Beneficiamento
        </button>

      </div>

    </div>


    <!-- FINALIZAÇÃO -->

    <div
      id="finalizacao"
      class="card oculto"
    >

      <div class="titulo">
        Finalização
      </div>


      <label>
        Umidade depois (%)
      </label>

      <input
        id="umidadeDepois"
        type="number"
        step="0.1"
        placeholder="Ex.: 12,8"
      >


      <label>
        Peso depois (kg)
      </label>

      <input
        id="pesoDepois"
        type="number"
        step="0.01"
        placeholder="Ex.: 1160"
      >


      <label>
        Observação
      </label>

      <textarea
        id="observacao"
        placeholder="Observações do processo">
      </textarea>


      <button
        class="verde"
        onclick="salvar()"
      >
        💾 Salvar Beneficiamento
      </button>

    </div>


    <!-- RESULTADO -->

    <div
      id="resultado"
      class="card oculto"
    >

      <div class="titulo">
        Processo concluído
      </div>

      <div class="dados">

        <div class="linha">
          <span class="campo">
            Descarte
          </span>

          <span
            class="valor"
            id="rDescarte">
          </span>
        </div>

        <div class="linha">
          <span class="campo">
            Rendimento
          </span>

          <span
            class="valor"
            id="rRendimento">
          </span>
        </div>

        <div class="linha">
          <span class="campo">
            Tempo
          </span>

          <span
            class="valor"
            id="rTempo">
          </span>
        </div>

      </div>


      <button
        class="verde"
        onclick="location.reload()"
      >
        + Novo Beneficiamento
      </button>

    </div>


  </div>


  <div class="rodape">
    AgroTrace • Controle de Beneficiamento
  </div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbx7boqIdOtBzhFpxY2sF9Bp7MDR4_VdKTJWAOAwGwt67UHoBRrnIYshDCbXe4HzqmXv/exec";


let loteAtual = null;

let inicio = null;

let intervalo = null;

let leitor = null;


/* =========================
   STATUS
========================= */

function status(texto, tipo) {

  const elemento =
    document.getElementById("status");

  elemento.innerText = texto;

  elemento.className =
    "status " + tipo;

}


/* =========================
   CONSULTAR API
========================= */

function consultar(lote) {

  return new Promise(
    function(resolve, reject) {

      const nomeCallback =
        "agroTrace_" +
        Date.now();

      const script =
        document.createElement("script");


      window[nomeCallback] =
        function(resposta) {

          delete window[nomeCallback];

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }

          resolve(resposta);

        };


      script.onerror =
        function() {

          delete window[nomeCallback];

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }

          reject(
            new Error(
              "Erro ao acessar a API."
            )
          );

        };


      script.src =
        API_URL +
        "?acao=buscar" +
        "&lote=" +
        encodeURIComponent(lote) +
        "&callback=" +
        encodeURIComponent(nomeCallback);


      document.body.appendChild(script);


      setTimeout(
        function() {

          if (window[nomeCallback]) {

            delete window[nomeCallback];

            if (script.parentNode) {
              script.parentNode.removeChild(script);
            }

            reject(
              new Error(
                "Tempo limite da consulta."
              )
            );

          }

        },
        15000
      );

    }
  );

}


/* =========================
   BUSCAR LOTE
========================= */

async function buscarLote() {

  const lote =
    document
      .getElementById("lote")
      .value
      .trim();


  if (!lote) {

    status(
      "Digite o número do lote.",
      "erro"
    );

    return;
  }


  status(
    "Consultando lote...",
    "info"
  );


  try {

    const resposta =
      await consultar(lote);


    console.log(
      "Resposta:",
      resposta
    );


    if (
      resposta.status !== "ok"
    ) {

      status(
        "Lote não encontrado.",
        "erro"
      );

      return;
    }


    mostrarLote(
      resposta.dados
    );


    status(
      "Lote localizado com sucesso.",
      "ok"
    );


  } catch (erro) {

    console.error(
      erro
    );

    status(
      "Erro ao consultar lote.",
      "erro"
    );

  }

}


/* =========================
   MOSTRAR LOTE
========================= */

function mostrarLote(dados) {

  loteAtual =
    dados;


  document
    .getElementById("dLote")
    .innerText =
      dados.LOTE || "-";


  document
    .getElementById("dQR")
    .innerText =
      dados.QR || "-";


  document
    .getElementById("dVariedade")
    .innerText =
      dados.VARIEDADE || "-";


  document
    .getElementById("dPeneira")
    .innerText =
      dados.PENEIRA || "-";


  document
    .getElementById("dUmidade")
    .innerText =
      dados.UMIDADE_RECEBIMENTO || "-";


  document
    .getElementById("dPeso")
    .innerText =
      dados.PESO_RECEBIDO || "-";


  document
    .getElementById("dadosLote")
    .classList.remove("oculto");


  document
    .getElementById("beneficiamento")
    .classList.remove("oculto");

}


/* =========================
   INICIAR
========================= */

function iniciar() {

  const operador =
    document
      .getElementById("operador")
      .value
      .trim();


  const maquina =
    document
      .getElementById("maquina")
      .value;


  const umidade =
    document
      .getElementById("umidadeAntes")
      .value;


  const peso =
    document
      .getElementById("pesoAntes")
      .value;


  if (!operador) {

    status(
      "Informe o operador.",
      "erro"
    );

    return;
  }


  if (!maquina) {

    status(
      "Selecione a máquina.",
      "erro"
    );

    return;
  }


  if (!umidade || !peso) {

    status(
      "Informe umidade e peso antes.",
      "erro"
    );

    return;
  }


  inicio =
    new Date();


  document
    .getElementById("btnIniciar")
    .style.display =
    "none";


  document
    .getElementById("areaProcesso")
    .classList.remove("oculto");


  intervalo =
    setInterval(
      atualizarTimer,
      1000
    );


  atualizarTimer();


  status(
    "Beneficiamento iniciado.",
    "ok"
  );

}


/* =========================
   TIMER
========================= */

function atualizarTimer() {

  if (!inicio) {
    return;
  }


  const segundos =
    Math.floor(
      (new Date() - inicio) / 1000
    );


  const h =
    Math.floor(
      segundos / 3600
    );


  const m =
    Math.floor(
      (segundos % 3600) / 60
    );


  const s =
    segundos % 60;


  document
    .getElementById("timer")
    .innerText =
      String(h).padStart(2,"0") +
      ":" +
      String(m).padStart(2,"0") +
      ":" +
      String(s).padStart(2,"0");

}


/* =========================
   FINALIZAR
========================= */

function finalizar() {

  clearInterval(
    intervalo
  );


  document
    .getElementById("finalizacao")
    .classList.remove("oculto");


  status(
    "Informe os dados finais.",
    "info"
  );

}


/* =========================
   SALVAR
========================= */

function salvar() {

  const pesoAntes =
    Number(
      document
        .getElementById("pesoAntes")
        .value
        .replace(",", ".")
    );


  const pesoDepois =
    Number(
      document
        .getElementById("pesoDepois")
        .value
        .replace(",", ".")
    );


  const umidadeDepois =
    document
      .getElementById("umidadeDepois")
      .value;


  if (
    !pesoDepois ||
    !umidadeDepois
  ) {

    status(
      "Informe os dados finais.",
      "erro"
    );

    return;
  }


  const descarte =
    pesoAntes -
    pesoDepois;


  const rendimento =
    (pesoDepois / pesoAntes) * 100;


  const agora =
    new Date();


  const tempoSegundos =
    Math.floor(
      (agora - inicio) / 1000
    );


  const h =
    Math.floor(
      tempoSegundos / 3600
    );


  const m =
    Math.floor(
      (tempoSegundos % 3600) / 60
    );


  const s =
    tempoSegundos % 60;


  const tempo =
    String(h).padStart(2,"0") +
    ":" +
    String(m).padStart(2,"0") +
    ":" +
    String(s).padStart(2,"0");


  /*
   * POR ENQUANTO:
   * vamos mostrar o resultado na tela.
   */

  document
    .getElementById("rDescarte")
    .innerText =
      descarte.toFixed(2) +
      " kg";


  document
    .getElementById("rRendimento")
    .innerText =
      rendimento.toFixed(2) +
      "%";


  document
    .getElementById("rTempo")
    .innerText =
      tempo;


  document
    .getElementById("resultado")
    .classList.remove("oculto");


  document
    .getElementById("finalizacao")
    .classList.add("oculto");


  status(
    "Beneficiamento concluído.",
    "ok"
  );

}


/* =========================
   QR CODE
========================= */

function abrirScanner() {

  const elemento =
    document.getElementById("scanner");


  elemento.style.display =
    "block";


  if (leitor) {
    return;
  }


  leitor =
    new Html5Qrcode(
      "scanner"
    );


  leitor.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,
      qrbox: 250
    },

    function(texto) {

      document
        .getElementById("lote")
        .value =
          texto;


      leitor.stop()
        .then(
          function() {

            elemento.style.display =
              "none";

            leitor = null;

            buscarLote();

          }
        );

    },

    function() {}

  )
  .catch(
    function(erro) {

      console.error(
        erro
      );

      elemento.style.display =
        "none";

      status(
        "Não foi possível abrir a câmera.",
        "erro"
      );

    }
  );

}

</script>

</body>
</html>
