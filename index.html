<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>AgroTrace - Beneficiamento</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f3f5f4;

      color: #1f2933;

    }


    .topo {

      background: #1f5f3b;

      color: white;

      padding: 18px 20px;

      text-align: center;

    }


    .topo h1 {

      margin: 0;

      font-size: 24px;

    }


    .topo p {

      margin: 5px 0 0;

      font-size: 13px;

      opacity: .9;

    }


    .container {

      max-width: 700px;

      margin: 20px auto;

      padding: 0 15px 40px;

    }


    .card {

      background: white;

      border-radius: 12px;

      padding: 20px;

      margin-bottom: 18px;

      box-shadow:
        0 2px 10px
        rgba(0,0,0,.08);

    }


    .card h2 {

      margin-top: 0;

      font-size: 19px;

    }


    label {

      display: block;

      margin-top: 14px;

      margin-bottom: 6px;

      font-weight: bold;

      font-size: 14px;

    }


    input,
    select,
    textarea {

      width: 100%;

      padding: 12px;

      border:
        1px solid #cbd5d1;

      border-radius: 8px;

      font-size: 16px;

      background: white;

    }


    textarea {

      min-height: 90px;

      resize: vertical;

    }


    button {

      width: 100%;

      border: 0;

      border-radius: 8px;

      padding: 13px;

      margin-top: 12px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }


    button:disabled {

      opacity: .5;

    }


    .btn-principal {

      background: #1f5f3b;

      color: white;

    }


    .btn-secundario {

      background: #e8efeb;

      color: #1f5f3b;

    }


    .btn-finalizar {

      background: #b42318;

      color: white;

    }


    .grid {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 12px;

    }


    .valor {

      background: #f5f7f6;

      padding: 11px;

      border-radius: 7px;

      border:
        1px solid #e1e7e4;

    }


    .status {

      padding: 12px;

      border-radius: 8px;

      margin-top: 12px;

      font-size: 14px;

      display: none;

    }


    .status.ok {

      display: block;

      background: #e7f5ec;

      color: #176b3a;

    }


    .status.erro {

      display: block;

      background: #fdecec;

      color: #a11a1a;

    }


    .status.info {

      display: block;

      background: #eef4f8;

      color: #24516b;

    }


    #areaScanner {

      display: none;

      margin-top: 15px;

    }


    #reader {

      width: 100%;

      overflow: hidden;

      border-radius: 10px;

    }


    .timer {

      text-align: center;

      font-size: 34px;

      font-weight: bold;

      margin: 15px 0;

      color: #1f5f3b;

    }


    .resultado {

      background: #eef7f1;

      border-radius: 8px;

      padding: 15px;

      margin-top: 15px;

    }


    .oculto {

      display: none;

    }


    .rodape {

      text-align: center;

      color: #6b7280;

      font-size: 12px;

      margin-top: 20px;

    }


    @media (max-width: 550px) {

      .grid {

        grid-template-columns: 1fr;

      }

    }

  </style>

</head>


<body>


  <div class="topo">

    <h1>AgroTrace</h1>

    <p>
      Controle de Beneficiamento de Sementes
    </p>

  </div>


  <div class="container">


    <!-- LOCALIZAR -->

    <div class="card">

      <h2>🔎 Localizar Lote</h2>


      <button
        class="btn-principal"
        onclick="abrirScanner()">

        📷 Escanear QR Code

      </button>


      <div id="areaScanner">

        <div id="reader"></div>

        <button
          class="btn-secundario"
          onclick="fecharScanner()">

          Fechar câmera

        </button>

      </div>


      <label>

        Ou digite o número do lote

      </label>


      <input
        type="text"
        id="loteManual"
        placeholder="Ex.: LT26-001"
      >


      <button
        class="btn-principal"
        onclick="buscarPorLote()">

        🔎 Buscar pelo Lote

      </button>


      <div
        id="statusBusca"
        class="status">
      </div>

    </div>


    <!-- DADOS -->

    <div
      class="card oculto"
      id="cardLote">

      <h2>📋 Dados do Lote</h2>


      <div class="grid">

        <div>

          <label>QR</label>

          <div
            class="valor"
            id="campoQR">
            -
          </div>

        </div>


        <div>

          <label>Lote</label>

          <div
            class="valor"
            id="campoLote">
            -
          </div>

        </div>


        <div>

          <label>Variedade</label>

          <div
            class="valor"
            id="campoVariedade">
            -
          </div>

        </div>


        <div>

          <label>Peneira</label>

          <div
            class="valor"
            id="campoPeneira">
            -
          </div>

        </div>


        <div>

          <label>
            Umidade no recebimento
          </label>

          <div
            class="valor"
            id="campoUmidadeRecebimento">
            -
          </div>

        </div>


        <div>

          <label>
            Peso recebido
          </label>

          <div
            class="valor"
            id="campoPesoRecebido">
            -
          </div>

        </div>

      </div>

    </div>


    <!-- BENEFICIAMENTO -->

    <div
      class="card oculto"
      id="cardBeneficiamento">

      <h2>⚙️ Beneficiamento</h2>


      <label>
        Operador
      </label>

      <input
        type="text"
        id="operador"
        placeholder="Nome do operador"
      >


      <label>
        Máquina
      </label>

      <select id="maquina">

        <option value="">
          Selecione a máquina
        </option>

        <option value="CD 500">
          CD 500
        </option>

        <option value="CD 1000">
          CD 1000
        </option>

      </select>


      <div class="grid">

        <div>

          <label>
            Umidade antes
          </label>

          <input
            type="number"
            id="umidadeAntes"
            step="0.1"
            inputmode="decimal"
            placeholder="Ex.: 13,5"
          >

        </div>


        <div>

          <label>
            Peso antes (kg)
          </label>

          <input
            type="number"
            id="pesoAntes"
            step="0.01"
            inputmode="decimal"
            placeholder="Ex.: 1200"
          >

        </div>

      </div>


      <button
        class="btn-principal"
        id="btnIniciar"
        onclick="iniciarBeneficiamento()">

        ▶️ Iniciar Beneficiamento

      </button>


      <div
        id="areaProcesso"
        class="oculto">

        <div
          class="timer"
          id="timer">
          00:00:00
        </div>


        <button
          class="btn-finalizar"
          onclick="finalizarBeneficiamento()">

          ⏹️ Finalizar Beneficiamento

        </button>

      </div>

    </div>


    <!-- FINALIZAÇÃO -->

    <div
      class="card oculto"
      id="cardFinalizacao">

      <h2>
        ✅ Finalizar Beneficiamento
      </h2>


      <div class="grid">

        <div>

          <label>
            Umidade depois
          </label>

          <input
            type="number"
            id="umidadeDepois"
            step="0.1"
            inputmode="decimal"
            placeholder="Ex.: 12,8"
          >

        </div>


        <div>

          <label>
            Peso depois (kg)
          </label>

          <input
            type="number"
            id="pesoDepois"
            step="0.01"
            inputmode="decimal"
            placeholder="Ex.: 1160"
          >

        </div>

      </div>


      <label>
        Observação
      </label>


      <textarea
        id="observacao"
        placeholder="Observação do processo...">
      </textarea>


      <div
        class="resultado"
        id="resultadoCalculo">

        <strong>Resultado</strong>

        <div id="resultadoTexto">

          Informe o peso depois
          para calcular.

        </div>

      </div>


      <button
        class="btn-principal"
        onclick="calcularResultado()">

        🧮 Calcular

      </button>


      <button
        class="btn-principal"
        onclick="salvarBeneficiamento()">

        💾 Salvar Beneficiamento

      </button>


      <div
        id="statusSalvar"
        class="status">
      </div>

    </div>


    <div class="rodape">

      AgroTrace • Controle de Beneficiamento

    </div>


  </div>


  <script>


    /*
     * =====================================================
     * API
     * =====================================================
     */

    const API_URL =
      "https://script.google.com/macros/s/AKfycbx7boqIdOtBzhFpxY2sF9Bp7MDR4_VdKTJWAOAwGwt67UHoBRrnIYshDCbXe4HzqmXv/exec";


    let scanner = null;

    let loteAtual = null;

    let inicioProcesso = null;

    let fimProcesso = null;

    let intervaloTimer = null;


    /*
     * =====================================================
     * BUSCA USANDO JSONP
     * =====================================================
     *
     * Aqui não usamos fetch().
     *
     * Isso evita o problema de comunicação
     * entre GitHub Pages e Google Apps Script.
     */


    function consultarAPI(parametros) {

      return new Promise(
        function(resolve, reject) {

          const callbackName =
            "agrotraceCallback_" +
            Date.now() +
            "_" +
            Math.floor(
              Math.random() * 10000
            );


          const script =
            document.createElement(
              "script"
            );


          const query =
            new URLSearchParams(
              parametros
            );


          query.set(
            "callback",
            callbackName
          );


          const timeout =
            setTimeout(
              function() {

                limpar();

                reject(
                  new Error(
                    "Tempo limite da consulta."
                  )
                );

              },
              15000
            );


          window[callbackName] =
            function(resultado) {

              clearTimeout(
                timeout
              );

              limpar();

              resolve(
                resultado
              );

            };


          function limpar() {

            delete window[
              callbackName
            ];

            if (script.parentNode) {

              script.parentNode.removeChild(
                script
              );

            }

          }


          script.onerror =
            function() {

              clearTimeout(
                timeout
              );

              limpar();

              reject(
                new Error(
                  "Não foi possível acessar a API."
                )
              );

            };


          script.src =
            API_URL +
            "?" +
            query.toString();


          document
            .body
            .appendChild(script);

        }
      );

    }


    /*
     * =====================================================
     * BUSCAR POR LOTE
     * =====================================================
     */

    async function buscarPorLote() {

      const lote =
        document
          .getElementById(
            "loteManual"
          )
          .value
          .trim();


      if (!lote) {

        mostrarStatus(
          "statusBusca",
          "Digite o número do lote.",
          "erro"
        );

        return;

      }


      mostrarStatus(
        "statusBusca",
        "Consultando lote...",
        "info"
      );


      try {

        const resultado =
          await consultarAPI({

            acao: "buscar",

            lote: lote

          });


        processarResultado(
          resultado
        );


      } catch (erro) {

        console.error(
          erro
        );


        mostrarStatus(
          "statusBusca",
          "Erro ao consultar lote. Verifique a conexão com a API.",
          "erro"
        );

      }

    }


    /*
     * =====================================================
     * BUSCAR POR QR
     * =====================================================
     */

    async function buscarPorQR(qr) {

      if (!qr) {

        mostrarStatus(
          "statusBusca",
          "QR Code vazio.",
          "erro"
        );

        return;

      }


      mostrarStatus(
        "statusBusca",
        "Consultando QR Code...",
        "info"
      );


      try {

        const resultado =
          await consultarAPI({

            acao: "buscar",

            qr: qr

          });


        processarResultado(
          resultado
        );


      } catch (erro) {

        console.error(
          erro
        );


        mostrarStatus(
          "statusBusca",
          "Erro ao consultar QR Code.",
          "erro"
        );

      }

    }


    /*
     * =====================================================
     * PROCESSAR LOTE
     * =====================================================
     */

    function processarResultado(
      resultado
    ) {

      if (
        !resultado ||
        resultado.status !== "ok"
      ) {

        mostrarStatus(
          "statusBusca",

          resultado &&
          resultado.mensagem
            ? resultado.mensagem
            : "Lote não encontrado.",

          "erro"
        );

        return;

      }


      loteAtual =
        resultado.dados;


      document
        .getElementById(
          "campoQR"
        )
        .textContent =
          loteAtual.QR || "-";


      document
        .getElementById(
          "campoLote"
        )
        .textContent =
          loteAtual.LOTE || "-";


      document
        .getElementById(
          "campoVariedade"
        )
        .textContent =
          loteAtual.VARIEDADE || "-";


      document
        .getElementById(
          "campoPeneira"
        )
        .textContent =
          formatarNumero(
            loteAtual.PENEIRA
          );


      const umidade =
        loteAtual.UMIDADE_RECEBIMENTO ??
        loteAtual[
          "UMIDADE_RECEBIMENTO "
        ] ??
        "";


      document
        .getElementById(
          "campoUmidadeRecebimento"
        )
        .textContent =
          formatarNumero(
            umidade
          );


      document
        .getElementById(
          "campoPesoRecebido"
        )
        .textContent =
          formatarNumero(
            loteAtual.PESO_RECEBIDO
          );


      document
        .getElementById(
          "cardLote"
        )
        .classList
        .remove("oculto");


      document
        .getElementById(
          "cardBeneficiamento"
        )
        .classList
        .remove("oculto");


      mostrarStatus(
        "statusBusca",
        "Lote localizado com sucesso.",
        "ok"
      );

    }


    /*
     * =====================================================
     * SCANNER
     * =====================================================
     */

    async function abrirScanner() {

      document
        .getElementById(
          "areaScanner"
        )
        .style.display =
          "block";


      try {

        scanner =
          new Html5Qrcode(
            "reader"
          );


        const cameras =
          await Html5Qrcode
            .getCameras();


        if (
          !cameras ||
          cameras.length === 0
        ) {

          throw new Error(
            "Nenhuma câmera encontrada."
          );

        }


        let camera =
          cameras[
            cameras.length - 1
          ].id;


        for (
          const c of cameras
        ) {

          const nome =
            (
              c.label || ""
            ).toLowerCase();


          if (

            nome.includes("back") ||
            nome.includes("rear") ||
            nome.includes("traseira") ||
            nome.includes("environment")

          ) {

            camera = c.id;

            break;

          }

        }


        await scanner.start(

          camera,

          {

            fps: 10,

            qrbox: {

              width: 250,

              height: 250

            }

          },

          function(texto) {

            fecharScanner();

            buscarPorQR(
              texto
            );

          },

          function() {}

        );


      } catch (erro) {

        console.error(
          erro
        );


        mostrarStatus(
          "statusBusca",
          "Não foi possível acessar a câmera.",
          "erro"
        );

      }

    }


    async function fecharScanner() {

      if (scanner) {

        try {

          await scanner.stop();

          await scanner.clear();

        } catch (erro) {

          console.log(
            erro
          );

        }

        scanner = null;

      }


      document
        .getElementById(
          "areaScanner"
        )
        .style.display =
          "none";

    }


    /*
     * =====================================================
     * INICIAR
     * =====================================================
     */

    function iniciarBeneficiamento() {

      const operador =
        document
          .getElementById(
            "operador"
          )
          .value
          .trim();


      const maquina =
        document
          .getElementById(
            "maquina"
          )
          .value;


      const umidade =
        document
          .getElementById(
            "umidadeAntes"
          )
          .value;


      const peso =
        document
          .getElementById(
            "pesoAntes"
          )
          .value;


      if (!operador) {

        alert(
          "Informe o operador."
        );

        return;

      }


      if (!maquina) {

        alert(
          "Selecione a máquina."
        );

        return;

      }


      if (!umidade) {

        alert(
          "Informe a umidade antes."
        );

        return;

      }


      if (!peso) {

        alert(
          "Informe o peso antes."
        );

        return;

      }


      inicioProcesso =
        new Date();


      document
        .getElementById(
          "btnIniciar"
        )
        .disabled =
          true;


      document
        .getElementById(
          "areaProcesso"
        )
        .classList
        .remove("oculto");


      atualizarTimer();


      intervaloTimer =
        setInterval(
          atualizarTimer,
          1000
        );

    }


    /*
     * =====================================================
     * TIMER
     * =====================================================
     */

    function atualizarTimer() {

      if (!inicioProcesso) {

        return;

      }


      const agora =
        new Date();


      const tempo =
        agora -
        inicioProcesso;


      document
        .getElementById(
          "timer"
        )
        .textContent =
          formatarTempo(
            tempo
          );

    }


    /*
     * =====================================================
     * FINALIZAR
     * =====================================================
     */

    function finalizarBeneficiamento() {

      if (!inicioProcesso) {

        alert(
          "O beneficiamento ainda não foi iniciado."
        );

        return;

      }


      fimProcesso =
        new Date();


      clearInterval(
        intervaloTimer
      );


      document
        .getElementById(
          "areaProcesso"
        )
        .classList
        .add("oculto");


      document
        .getElementById(
          "cardFinalizacao"
        )
        .classList
        .remove("oculto");

    }


    /*
     * =====================================================
     * CALCULAR
     * =====================================================
     */

    function calcularResultado() {

      const pesoAntes =
        converterNumero(
          document
            .getElementById(
              "pesoAntes"
            )
            .value
        );


      const pesoDepois =
        converterNumero(
          document
            .getElementById(
              "pesoDepois"
            )
            .value
        );


      if (
        pesoAntes <= 0 ||
        pesoDepois <= 0
      ) {

        document
          .getElementById(
            "resultadoTexto"
          )
          .textContent =
            "Informe os pesos antes e depois.";

        return;

      }


      const descarte =
        pesoAntes -
        pesoDepois;


      const rendimento =
        (
          pesoDepois /
          pesoAntes
        ) * 100;


      document
        .getElementById(
          "resultadoTexto"
        )
        .innerHTML =

          "Descarte: <strong>" +

          formatarNumero(
            descarte
          ) +

          " kg</strong><br>" +

          "Rendimento: <strong>" +

          rendimento
            .toFixed(2)
            .replace(".", ",") +

          "%</strong>";

    }


    /*
     * =====================================================
     * SALVAR
     * =====================================================
     */

    function salvarBeneficiamento() {

      if (!loteAtual) {

        alert(
          "Nenhum lote selecionado."
        );

        return;

      }


      if (!inicioProcesso) {

        alert(
          "O beneficiamento não foi iniciado."
        );

        return;

      }


      if (!fimProcesso) {

        alert(
          "Finalize o beneficiamento."
        );

        return;

      }


      const pesoDepois =
        document
          .getElementById(
            "pesoDepois"
          )
          .value;


      const umidadeDepois =
        document
          .getElementById(
            "umidadeDepois"
          )
          .value;


      if (!pesoDepois) {

        alert(
          "Informe o peso depois."
        );

        return;

      }


      if (!umidadeDepois) {

        alert(
          "Informe a umidade depois."
        );

        return;

      }


      const dados = {

        qr:
          loteAtual.QR || "",

        lote:
          loteAtual.LOTE || "",

        variedade:
          loteAtual.VARIEDADE || "",

        peneira:
          loteAtual.PENEIRA || "",

        umidadeRecebimento:
          loteAtual.UMIDADE_RECEBIMENTO ??
          loteAtual[
            "UMIDADE_RECEBIMENTO "
          ] ??
          "",

        pesoRecebimento:
          loteAtual.PESO_RECEBIDO || "",

        operador:
          document
            .getElementById(
              "operador"
            )
            .value
            .trim(),

        maquina:
          document
            .getElementById(
              "maquina"
            )
            .value,

        dataInicio:
          formatarData(
            inicioProcesso
          ),

        horaInicio:
          formatarHora(
            inicioProcesso
          ),

        umidadeAntes:
          converterNumero(
            document
              .getElementById(
                "umidadeAntes"
              )
              .value
          ),

        pesoAntes:
          converterNumero(
            document
              .getElementById(
                "pesoAntes"
              )
              .value
          ),

        dataFim:
          formatarData(
            fimProcesso
          ),

        horaFim:
          formatarHora(
            fimProcesso
          ),

        umidadeDepois:
          converterNumero(
            umidadeDepois
          ),

        pesoDepois:
          converterNumero(
            pesoDepois
          ),

        tempoProcesso:
          formatarTempo(
            fimProcesso -
            inicioProcesso
          ),

        observacao:
          document
            .getElementById(
              "observacao"
            )
            .value

      };


      enviarBeneficiamento(
        dados
      );

    }


    /*
     * =====================================================
     * ENVIO
     * =====================================================
     */

    function enviarBeneficiamento(
      dados
    ) {

      mostrarStatus(
        "statusSalvar",
        "Enviando beneficiamento...",
        "info"
      );


      const iframe =
        document.createElement(
          "iframe"
        );


      iframe.name =
        "agrotrace_" +
        Date.now();


      iframe.style.display =
        "none";


      document.body.appendChild(
        iframe
      );


      const form =
        document.createElement(
          "form"
        );


      form.method =
        "POST";


      form.action =
        API_URL;


      form.target =
        iframe.name;


      const campo =
        document.createElement(
          "input"
        );


      campo.type =
        "hidden";


      campo.name =
        "dados";


      campo.value =
        JSON.stringify(
          dados
        );


      form.appendChild(
        campo
      );


      document.body.appendChild(
        form
      );


      form.submit();


      mostrarStatus(
        "statusSalvar",
        "Beneficiamento enviado para gravação.",
        "ok"
      );


      setTimeout(
        function() {

          iframe.remove();

          form.remove();

        },
        5000
      );

    }


    /*
     * =====================================================
     * AUXILIARES
     * =====================================================
     */

    function mostrarStatus(
      id,
      mensagem,
      tipo
    ) {

      const elemento =
        document.getElementById(
          id
        );


      elemento.textContent =
        mensagem;


      elemento.className =
        "status " +
        tipo;

    }


    function converterNumero(
      valor
    ) {

      if (
        valor === null ||
        valor === undefined ||
        valor === ""
      ) {

        return 0;

      }


      return Number(
        String(valor)
          .replace(",", ".")
      );

    }


    function formatarNumero(
      valor
    ) {

      if (
        valor === null ||
        valor === undefined ||
        valor === ""
      ) {

        return "-";

      }


      const numero =
        Number(valor);


      if (
        isNaN(numero)
      ) {

        return String(
          valor
        );

      }


      return numero
        .toFixed(2)
        .replace(".", ",");

    }


    function formatarData(
      data
    ) {

      return (

        String(
          data.getDate()
        ).padStart(2, "0")

        +

        "/" +

        String(
          data.getMonth() + 1
        ).padStart(2, "0")

        +

        "/" +

        data.getFullYear()

      );

    }


    function formatarHora(
      data
    ) {

      return (

        String(
          data.getHours()
        ).padStart(2, "0")

        +

        ":" +

        String(
          data.getMinutes()
        ).padStart(2, "0")

        +

        ":" +

        String(
          data.getSeconds()
        ).padStart(2, "0")

      );

    }


    function formatarTempo(
      ms
    ) {

      const total =
        Math.floor(
          ms / 1000
        );


      const horas =
        Math.floor(
          total / 3600
        );


      const minutos =
        Math.floor(
          (total % 3600) / 60
        );


      const segundos =
        total % 60;


      return (

        String(horas)
          .padStart(2, "0")

        +

        ":" +

        String(minutos)
          .padStart(2, "0")

        +

        ":" +

        String(segundos)
          .padStart(2, "0")

      );

    }


  </script>
