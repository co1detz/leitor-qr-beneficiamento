body {

@media (max-width: 500px) {

</style>

<!-- ================================= -->
<!-- JAVASCRIPT -->
<!-- ================================= -->

<script>


/*
 * =========================================
 * CONFIGURAÇÃO
 * =========================================
 */

const API_URL =
"https://script.google.com/macros/s/AKfycbx7boqIdOtBzhFpxY2sF9Bp7MDR4_VdKTJWAOAwGwt67UHoBRrnIYshDCbXe4HzqmXv/exec";


let loteAtual = null;

let inicioProcesso = null;

let fimProcesso = null;

let intervaloTimer = null;

let scanner = null;


/*
 * =========================================
 * ELEMENTOS
 * =========================================
 */

const statusBusca =
document.getElementById("statusBusca");

const statusSalvar =
document.getElementById("statusSalvar");


/*
 * =========================================
 * STATUS
 * =========================================
 */

function mostrarStatus(elemento, mensagem, tipo) {

  elemento.textContent = mensagem;

  elemento.className =
    "status " + tipo;

}


/*
 * =========================================
 * JSONP
 * =========================================
 */

function consultarAPI(parametros) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      "agrotraceCallback_" +
      Date.now() +
      "_" +
      Math.floor(
        Math.random() * 100000
      );


    const script =
      document.createElement("script");


    const query =
      new URLSearchParams(
        parametros
      );


    query.set(
      "callback",
      callbackName
    );


    const timeout =
      setTimeout(function() {

        cleanup();

        reject(
          new Error(
            "Tempo limite da API excedido."
          )
        );

      }, 15000);


    window[callbackName] =
      function(resultado) {

        clearTimeout(timeout);

        cleanup();

        resolve(resultado);

      };


    function cleanup() {

      delete window[callbackName];

      if (script.parentNode) {

        script.parentNode.removeChild(
          script
        );

      }

    }


    script.onerror =
      function() {

        clearTimeout(timeout);

        cleanup();

        reject(
          new Error(
            "Não foi possível conectar à API."
          )
        );

      };


    script.src =
      API_URL +
      "?" +
      query.toString();


    document.body.appendChild(
      script
    );

  });

}


/*
 * =========================================
 * BUSCAR POR LOTE
 * =========================================
 */

async function buscarPorLote() {

  const lote =
    document
      .getElementById("loteInput")
      .value
      .trim();


  if (!lote) {

    mostrarStatus(
      statusBusca,
      "Digite o número do lote.",
      "erro"
    );

    return;

  }


  mostrarStatus(
    statusBusca,
    "Consultando lote...",
    "ok"
  );


  try {

    const resultado =
      await consultarAPI({

        acao: "buscar",

        lote: lote

      });


    processarResultadoBusca(
      resultado
    );


  } catch (erro) {

    console.error(erro);

    mostrarStatus(
      statusBusca,
      "Erro ao consultar lote. Verifique a conexão com a API.",
      "erro"
    );

  }

}


/*
 * =========================================
 * BUSCAR POR QR
 * =========================================
 */

async function buscarPorQR(qr) {

  try {

    mostrarStatus(
      statusBusca,
      "Consultando QR Code...",
      "ok"
    );


    const resultado =
      await consultarAPI({

        acao: "buscar",

        qr: qr

      });


    processarResultadoBusca(
      resultado
    );


  } catch (erro) {

    console.error(erro);

    mostrarStatus(
      statusBusca,
      "Erro ao consultar lote. Verifique a conexão com a API.",
      "erro"
    );

  }

}


/*
 * =========================================
 * PROCESSAR RESULTADO
 * =========================================
 */

function processarResultadoBusca(resultado) {

  console.log(
    "Resposta da API:",
    resultado
  );


  if (!resultado) {

    throw new Error(
      "API retornou resposta vazia."
    );

  }


  if (
    resultado.status !== "ok"
  ) {

    mostrarStatus(
      statusBusca,
      resultado.mensagem ||
      "Lote não encontrado.",
      "erro"
    );

    return;

  }


  loteAtual =
    resultado.dados;


  document
    .getElementById("campoQR")
    .textContent =
      loteAtual.QR || "-";


  document
    .getElementById("campoLote")
    .textContent =
      loteAtual.LOTE || "-";


  document
    .getElementById("campoVariedade")
    .textContent =
      loteAtual.VARIEDADE || "-";


  document
    .getElementById("campoPeneira")
    .textContent =
      loteAtual.PENEIRA || "-";


  const umidadeRecebimento =
    loteAtual.UMIDADE_RECEBIMENTO ??
    loteAtual["UMIDADE_RECEBIMENTO "] ??
    "";


  document
    .getElementById("campoUmidadeRecebimento")
    .textContent =
      umidadeRecebimento !== ""
        ? umidadeRecebimento + "%"
        : "-";


  document
    .getElementById("campoPesoRecebimento")
    .textContent =
      loteAtual.PESO_RECEBIDO
        ? loteAtual.PESO_RECEBIDO + " kg"
        : "-";


  document
    .getElementById("dadosLoteCard")
    .classList
    .remove("hidden");


  document
    .getElementById("beneficiamentoCard")
    .classList
    .remove("hidden");


  mostrarStatus(
    statusBusca,
    "Lote localizado com sucesso.",
    "ok"
  );

}


/*
 * =========================================
 * SCANNER QR CODE
 * =========================================
 */

function abrirScanner() {

  const scannerDiv =
    document.getElementById(
      "scanner"
    );


  scannerDiv.classList.remove(
    "hidden"
  );


  if (scanner) {

    return;

  }


  scanner =
    new Html5Qrcode(
      "scanner"
    );


  Html5Qrcode
    .getCameras()
    .then(function(cameras) {

      if (
        !cameras ||
        cameras.length === 0
      ) {

        throw new Error(
          "Nenhuma câmera encontrada."
        );

      }


      let cameraId =
        cameras[
          cameras.length - 1
        ].id;


      for (
        let i = 0;
        i < cameras.length;
        i++
      ) {

        const label =
          (
            cameras[i].label ||
            ""
          ).toLowerCase();


        if (
          label.includes("back") ||
          label.includes("trás") ||
          label.includes("traseira") ||
          label.includes("environment")
        ) {

          cameraId =
            cameras[i].id;

          break;

        }

      }


      scanner.start(

        cameraId,

        {
          fps: 10,

          qrbox: {
            width: 250,
            height: 250
          }

        },

        function(decodedText) {

          scanner.stop()
            .then(function() {

              scannerDiv
                .classList
                .add("hidden");


              scanner.clear();


              scanner = null;


              document
                .getElementById("loteInput")
                .value =
                  decodedText;


              buscarPorQR(
                decodedText
              );

            });

        },

        function(errorMessage) {

          // leitura normal continua

        }

      );

    })

    .catch(function(erro) {

      console.error(erro);

      mostrarStatus(
        statusBusca,
        "Não foi possível acessar a câmera.",
        "erro"
      );

    });

}


/*
 * =========================================
 * INICIAR BENEFICIAMENTO
 * =========================================
 */

function iniciarBeneficiamento() {

  const operador =
    document
      .getElementById("operador")
      .value
      .trim();


  const maquina =
    document
      .getElementById("maquina")
      .value;


  const umidadeAntes =
    document
      .getElementById("umidadeAntes")
      .value;


  const pesoAntes =
    document
      .getElementById("pesoAntes")
      .value;


  if (!operador) {

    alert(
      "Informe o operador."
    );

    return;

  }


  if (!maquina) {

    alert(
      "Selecione a máquina."
    );

    return;

  }


  if (!umidadeAntes) {

    alert(
      "Informe a umidade antes."
    );

    return;

  }


  if (!pesoAntes) {

    alert(
      "Informe o peso antes."
    );

    return;

  }


  inicioProcesso =
    new Date();


  document
    .getElementById("btnIniciar")
    .classList
    .add("hidden");


  document
    .getElementById("btnFinalizar")
    .classList
    .remove("hidden");


  iniciarTimer();

}


/*
 * =========================================
 * TIMER
 * =========================================
 */

function iniciarTimer() {

  intervaloTimer =
    setInterval(
      atualizarTimer,
      1000
    );


  atualizarTimer();

}


function atualizarTimer() {

  if (!inicioProcesso) {

    return;

  }


  const agora =
    new Date();


  const diferenca =
    agora - inicioProcesso;


  document
    .getElementById("timer")
    .textContent =
      formatarTempo(
        diferenca
      );

}


function formatarTempo(ms) {

  const totalSegundos =
    Math.floor(
      ms / 1000
    );


  const horas =
    Math.floor(
      totalSegundos / 3600
    );


  const minutos =
    Math.floor(
      (totalSegundos % 3600) / 60
    );


  const segundos =
    totalSegundos % 60;


  return (

    String(horas)
      .padStart(2, "0")

    + ":" +

    String(minutos)
      .padStart(2, "0")

    + ":" +

    String(segundos)
      .padStart(2, "0")

  );

}


/*
 * =========================================
 * FINALIZAR
 * =========================================
 */

function finalizarBeneficiamento() {

  if (!inicioProcesso) {

    return;

  }


  fimProcesso =
    new Date();


  clearInterval(
    intervaloTimer
  );


  document
    .getElementById("btnFinalizar")
    .classList
    .add("hidden");


  document
    .getElementById("finalizacaoCard")
    .classList
    .remove("hidden");


  calcularResultado();

}


/*
 * =========================================
 * CÁLCULO
 * =========================================
 */

function calcularResultado() {

  const pesoAntes =
    Number(
      document
        .getElementById("pesoAntes")
        .value
    );


  const pesoDepois =
    Number(
      document
        .getElementById("pesoDepois")
        .value
    );


  if (
    !pesoAntes ||
    !pesoDepois
  ) {

    return;

  }


  const descarte =
    pesoAntes -
    pesoDepois;


  const rendimento =
    (
      pesoDepois /
      pesoAntes
    ) * 100;


  document
    .getElementById("resultadoCalculo")
    .classList
    .remove("hidden");


  document
    .getElementById("textoCalculo")
    .innerHTML =

      "Peso antes: <strong>" +
      pesoAntes.toFixed(2) +
      " kg</strong><br><br>" +

      "Peso depois: <strong>" +
      pesoDepois.toFixed(2) +
      " kg</strong><br><br>" +

      "Descarte: <strong>" +
      descarte.toFixed(2) +
      " kg</strong><br><br>" +

      "Rendimento: <strong>" +
      rendimento.toFixed(2) +
      "%</strong>";

}


/*
 * =========================================
 * SALVAR BENEFICIAMENTO
 * =========================================
 */

function salvarBeneficiamento() {

  const umidadeDepois =
    document
      .getElementById("umidadeDepois")
      .value;


  const pesoDepois =
    document
      .getElementById("pesoDepois")
      .value;


  if (!umidadeDepois) {

    alert(
      "Informe a umidade depois."
    );

    return;

  }


  if (!pesoDepois) {

    alert(
      "Informe o peso depois."
    );

    return;

  }


  calcularResultado();


  const operador =
    document
      .getElementById("operador")
      .value
      .trim();


  const maquina =
    document
      .getElementById("maquina")
      .value;


  const umidadeAntes =
    document
      .getElementById("umidadeAntes")
      .value;


  const pesoAntes =
    document
      .getElementById("pesoAntes")
      .value;


  const observacao =
    document
      .getElementById("observacao")
      .value;


  const dados = {

    qr:
      loteAtual.QR || "",

    lote:
      loteAtual.LOTE || "",

    variedade:
      loteAtual.VARIEDADE || "",

    peneira:
      loteAtual.PENEIRA || "",

    umidadeRecebimento:
      loteAtual.UMIDADE_RECEBIMENTO ??
      loteAtual["UMIDADE_RECEBIMENTO "] ??
      "",

    pesoRecebimento:
      loteAtual.PESO_RECEBIDO || "",

    operador:
      operador,

    maquina:
      maquina,

    dataInicio:
      formatarData(
        inicioProcesso
      ),

    horaInicio:
      formatarHora(
        inicioProcesso
      ),

    umidadeAntes:
      umidadeAntes,

    pesoAntes:
      pesoAntes,

    dataFim:
      formatarData(
        fimProcesso
      ),

    horaFim:
      formatarHora(
        fimProcesso
      ),

    umidadeDepois:
      umidadeDepois,

    pesoDepois:
      pesoDepois,

    tempoProcesso:
      formatarTempo(
        fimProcesso -
        inicioProcesso
      ),

    observacao:
      observacao

  };


  enviarBeneficiamento(
    dados
  );

}


/*
 * =========================================
 * ENVIAR PARA GOOGLE APPS SCRIPT
 * =========================================
 */

function enviarBeneficiamento(dados) {

  const iframe =
    document.createElement(
      "iframe"
    );


  iframe.name =
    "agrotrace_post_iframe";


  iframe.style.display =
    "none";


  document.body.appendChild(
    iframe
  );


  const form =
    document.createElement(
      "form"
    );


  form.method =
    "POST";


  form.action =
    API_URL;


  form.target =
    "agrotrace_post_iframe";


  const input =
    document.createElement(
      "input"
    );


  input.type =
    "hidden";


  input.name =
    "dados";


  input.value =
    JSON.stringify(
      dados
    );


  form.appendChild(
    input
  );


  document.body.appendChild(
    form
  );


  form.submit();


  mostrarStatus(
    statusSalvar,
    "Beneficiamento enviado para registro.",
    "ok"
  );


  setTimeout(
    function() {

      iframe.remove();

      form.remove();

    },
    5000
  );

}


/*
 * =========================================
 * DATA
 * =========================================
 */

function formatarData(data) {

  if (!data) {

    return "";

  }


  const dia =
    String(
      data.getDate()
    ).padStart(2, "0");


  const mes =
    String(
      data.getMonth() + 1
    ).padStart(2, "0");


  const ano =
    data.getFullYear();


  return (
    dia +
    "/" +
    mes +
    "/" +
    ano
  );

}


/*
 * =========================================
 * HORA
 * =========================================
 */

function formatarHora(data) {

  if (!data) {

    return "";

  }


  const hora =
    String(
      data.getHours()
    ).padStart(2, "0");


  const minuto =
    String(
      data.getMinutes()
    ).padStart(2, "0");


  const segundo =
    String(
      data.getSeconds()
    ).padStart(2, "0");


  return (
    hora +
    ":" +
    minuto +
    ":" +
    segundo
  );

}

 */

document
  .getElementById("pesoDepois")
